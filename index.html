p-filter:blur(9px);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}.modal{max-width:580px;width:100%;max-height:90vh;overflow:auto;background:#202827;border:1px solid #a48e595f;padding:32px;box-shadow:0 30px 100px #0009;position:relative;border-radius:5px}.modal h2{font-size:28px;font-weight:400;margin:10px 0 18px}.modal p{font-size:14px;line-height:1.95;color:#d7d1c1;white-space:pre-line}.modal .close{position:absolute;right:17px;top:15px;background:none;border:0;font-size:22px;color:#b5b7ac}.primary{border:1px solid #d5b578;background:#d5b578;color:#202622;padding:13px 20px;border-radius:3px;font-size:13px}.secondary{border:1px solid #a89d7a55;background:transparent;padding:12px 16px;border-radius:3px;font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.clue{border-left:2px solid var(--gold);background:#0002;padding:15px 18px;font-size:13px;line-height:1.9;margin:18px 0;color:#dfcfae}.floor{display:flex;gap:15px;align-items:center;margin:8px 0}.floor span{width:48px;color:#aab4a8;font-size:13px}.floor button{flex:1;padding:14px;background:#121c1c;border:1px solid #88785466}.feedback{color:#e4b47d!important;min-height:24px}.intro{max-width:670px;text-align:center;padding:48px}.intro h2{font-size:48px;line-height:1.3;margin:25px 0}.intro .subtitle{font-size:14px;color:#c9b58d;letter-spacing:4px}.intro .primary{min-width:220px;margin-top:15px}.intro p{font-size:14px}.intro .mini{font-size:11px;color:#8d9a90;margin-top:25px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#e4cf9f;color:#222c26;padding:13px 22px;border-radius:3px;z-index:40;font-size:13px;box-shadow:0 10px 30px #0008;max-width:90vw;text-align:center}.hidden{display:none!important}.orb{animation:pulse 3s ease-in-out infinite}.arrival{animation:arrive .65s ease-out}.success{font-size:80px;color:#c9aa6c}.ending-stamp{display:inline-block;border:3px double #a8c1a1;padding:10px 28px;color:#a8c1a1;transform:rotate(-7deg);font-size:28px;margin:10px}.switch-flash{animation:flash .7s}.progress{height:2px;background:#ffffff10;margin:17px 0}.progress div{height:100%;background:var(--gold);transition:width .5s}.sound-on{border-color:#d5b578;color:var(--gold)}@keyframes pulse{50%{opacity:.55}}@keyframes arrive{from{opacity:.3;transform:scale(1.02)}to{opacity:1;transform:scale(1)}}@keyframes flash{50%{filter:brightness(2);transform:translateY(-4px)}}@media(max-width:950px){.layout{grid-template-columns:1fr;gap:15px}aside{border-left:0;border-top:1px solid var(--line);padding:20px 0;display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{margin:10px 0}.section-label{margin-top:10px}.inventory{grid-template-columns:repeat(3,1fr)}.objective{margin:8px 0}.stage{border-radius:60px 60px 3px 3px}}@media(max-width:550px){header{height:70px}.brand{font-size:15px}.brand small{font-size:8px}.top-actions{gap:5px}.quiet{padding:8px;font-size:10px}.layout{padding:22px 15px}.stage{aspect-ratio:1.25}.stage svg{object-fit:cover}.hotspot .tag{font-size:10px;padding:5px}.room-head h1{font-size:26px}aside{grid-template-columns:1fr}.inventory{grid-template-columns:repeat(4,1fr)}.intro h2{font-size:37px}.modal{padding:27px 22px}.intro{padding:35px 24px}.chapter{font-size:10px}.room-note{font-size:12px}.nav{font-size:11px}footer{padding:0 15px 20px;font-size:9px}.seals{justify-content:start;gap:18px}.card{padding:14px}.section-label{margin-top:15px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<header><div class="brand">♜ 마왕성 퇴근 심사<small>DEPARTMENT OF EVIL · AFTER HOURS</small></div><div class="top-actions"><button class="quiet" id="approval">퇴근 서류철</button><button class="quiet" id="sound">소리 켜기</button><button class="quiet" id="help">도움말</button><button class="quiet" id="restart">처음부터</button></div></header>
<main class="layout"><section><div class="room-head"><div><div class="eyebrow" id="room-en">01 / HUMAN RESOURCES</div><h1 id="room-title">인사부 · 끝나지 않는 첫 출근</h1></div></div><div id="stage" class="stage"></div><div class="room-note" aria-live="polite"><span class="speaker">나의 혼잣말</span><span id="narration"></span></div><nav class="navigation" aria-label="부서 이동" id="nav"></nav></section><aside><div><div class="eyebrow">EMPLOYEE NO. 00404</div><h2>오늘 안에 퇴근하기</h2><p class="sub">직급: 수습 악당 &nbsp; / &nbsp; 남은 연차: 없음</p><div class="card"><div class="eyebrow">퇴근 승인서</div><div class="seals" id="seals"></div><div class="progress"><div id="progress"></div></div><div class="sub" id="seal-count"></div></div><div class="section-label">현재 할 일</div><p class="objective" id="objective"></p><button class="quiet" id="hint">✧ 막혔나요? 단계별 힌트</button></div><div><div class="section-label">소지품 · 클릭해서 살펴보기</div><div class="inventory" id="inventory"></div><p class="sub" id="item-note">물건 두 개를 차례로 선택하면 조합을 시도합니다.</p><div class="section-label">인사부 공지</div><p class="sub">“야근은 자율입니다.<br>퇴근은 심사 대상입니다.”</p></div></aside></main>
