<main class="layout"><section><div class="room-head"><div><div class="eyebrow" id="room-en">01 / HUMAN RESOURCES</div><h1 id="room-title">인사부 · 끝나지 않는 첫 출근</h1></div><div class="chapter">싱글플레이 · 체험판</div></div><div id="stage" class="stage"></div><div class="room-note" aria-live="polite"><span class="speaker">나의 혼잣말</span><span id="narration"></span></div><nav class="navigation" aria-label="부서 이동" id="nav"></nav></section><aside><div><div class="eyebrow">EMPLOYEE NO. 00404</div><h2>오늘 안에 퇴근하기</h2><p class="sub">직급: 수습 악당 &nbsp; / &nbsp; 남은 연차: 없음</p><div class="card"><div class="eyebrow">퇴근 승인서</div><div class="seals" id="seals"></div><div class="progress"><div id="progress"></div></div><div class="sub" id="seal-count"></div></div><div class="section-label">현재 할 일</div><p class="objective" id="objective"></p><button class="quiet" id="hint">✧ 막혔나요? 단계별 힌트</button></div><div><div class="section-label">소지품 · 클릭해서 살펴보기</div><div class="inventory" id="inventory"></div><p class="sub" id="item-note">물건 두 개를 차례로 선택하면 조합을 시도합니다.</p><div class="section-label">인사부 공지</div><p class="sub">“야근은 자율입니다.<br>퇴근은 심사 대상입니다.”</p></div></aside></main>

<script>
const KEY='demon-office-demo-v1';
const fresh=()=>({started:false,room:'hr',seals:[],items:[],org:['시설부','감사부','인사부'],hints:{},ended:false});
let state=fresh(),selected=null,sound=false,audio=null,lastFocus=null;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.seals)&&Array.isArray(saved.items)&&Array.isArray(saved.org)&&['hr','facility','audit','exit'].includes(saved.room))state={...fresh(),...saved};}catch{}
const $=s=>document.querySelector(s);const has=s=>state.seals.includes(s);const itemNames={candle:['♨','불씨 양초'],ice:['❄','만년빙'],cold:['✧','차가운 불꽃']};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{$('#save-status').textContent='자동 저장 불가 · 현재 창에서 계속 플레이 가능';}}
function tone(freq=440){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*1.5,audio.currentTime+.15);g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.35);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.35);}catch{}}
let toastTimer;function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3500);tone();}
function modal(title,body,extra=''){lastFocus=document.activeElement;$('#modal').className='modal '+extra;$('#modal').innerHTML=`<button class="close" aria-label="닫기" onclick="closeModal()">×</button><div class="eyebrow">DEPARTMENT OF EVIL</div><h2 id="modal-title">${title}</h2>${body}`;$('#overlay').classList.remove('hidden');$('#modal').querySelector('button').focus();}
function closeModal(){$('#overlay').classList.add('hidden');lastFocus?.focus();}
document.addEventListener('keydown',e=>{if($('#overlay').classList.contains('hidden'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const els=[...$('#modal').querySelectorAll('button:not(:disabled)')];const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
function seal(id){if(has(id))return;state.seals.push(id);tone(650);save();render();}
function collect(id){if(!state.items.includes(id)){state.items.push(id);save();render();toast(itemNames[id][1]+' 획득');}closeModal();}

text>`);}

“내일은 조직도 건드리지 마세요!”</p><p>당신은 대답하지 않았다.
오늘치 거짓말은 이미 다 했으니까.</p><div class="clue">《마왕성 퇴근 심사》 데모 완료<br>인사 · 시설 · 감사 — 세 부서 승인 획득</div><div class="actions"><button class="primary" onclick="closeModal()">퇴근의 여운 즐기기</button><button class="secondary" onclick="resetPrompt()">다시 플레이</button></div>`,'intro');}
const hintTexts={hr:['조직도의 명패를 누르면 부서가 바뀝니다. 지하부터 확정해 보세요.','감사부는 지하, 인사부는 시설부보다 위입니다. 각 부서는 한 번씩만 배치하세요.','2층 인사부 → 1층 시설부 → 지하 감사부 순서로 놓고 적용하세요.'],facility:['미믹의 주문은 “빛나지만 뜨겁지 않은 불”입니다. 두 부서의 물건을 살펴보세요.','인사부의 불씨 양초는 추위에도 꺼지지 않고, 시설부 만년빙은 열기만 흡수합니다.','양초와 만년빙을 챙긴 뒤 소지품에서 차례로 클릭하세요. 미믹을 눌러 차가운 불꽃을 건네면 됩니다.'],audit:['감사부에서는 사실을 말하면 탈락합니다. 규정과 창밖을 확인하세요.','현재 도장은 두 개, 미믹은 잡식성, 달은 둥급니다. 각각 반대인 답을 고르세요.','“하나도 없습니다” → “풀만 먹습니다” → “네모납니다”를 선택하세요.'],exit:['도장이 모두 모였습니다. 성문의 퇴근 단말기를 누르세요.']};
$('#hint').onclick=()=>{const k=!has('hr')?'hr':!has('facility')?'facility':!has('audit')?'audit':'exit';const n=Math.min(state.hints[k]||0,hintTexts[k].length-1);modal(`퇴근 지원 센터 · 힌트 ${n+1}`,`<p>${hintTexts[k][n]}</p><div class="sub">힌트로 인한 불이익은 없습니다. 다시 누르면 더 구체적인 도움을 드립니다.</div><div class="actions"><button class="primary" onclick="closeModal()">다시 살펴보기</button>${n<hintTexts[k].length-1?'<button class="secondary" onclick="document.querySelector(\'#hint\').click()">다음 힌트</button>':''}</div>`);state.hints[k]=n+1;save();};
$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'소리 끄기':'소리 켜기';$('#sound').classList.toggle('sound-on',sound);tone();};
$('#help').onclick=()=>modal('신입 악당 사용 설명서',`<p>화면의 이름표를 누르면 물건과 인물을 조사합니다.
아래 부서 버튼으로 이동합니다. 조직도를 고치면 길이 열립니다.
소지품 두 개를 차례로 누르면 조합을 시도합니다.
물건을 건넬 때는 해당 인물을 눌러 선택하세요.</p><div class="clue">시간 제한·게임 오버 없음 · 진행 자동 저장<br>막히면 단계별 힌트를 이용하세요.<br>키보드: Tab으로 이동, Enter로 선택, Esc로 창 닫기.</div>`);
function resetPrompt(){modal('첫 출근으로 돌아갈까요?','<p>지금까지 모은 물건과 도장, 저장된 진행이 초기화됩니다.</p><div class="actions"><button class="secondary" onclick="closeModal()">계속 플레이</button><button class="primary" onclick="resetGame()">초기화하고 시작</button></div>');}function resetGame(){state=fresh();selected=null;save();render();intro();}$('#restart').onclick=resetPrompt;
function intro(){modal('마왕성<br>퇴근 심사',`<div class="subtitle">첫 퇴근은 언제나 어렵다</div><p>세계 정복보다 어려운 일이 있다.
정시 퇴근이다.</p><p>마왕성의 신입 직원이 되어 세 부서의 승인을 받으세요.
이곳에서는 조직도가 건물을 바꾸고, 비품이 저녁을 주문합니다.</p><button class="primary" onclick="startGame()">퇴근하러 출근하기 →</button><div class="mini">1인 플레이 · 확장판 · 9개 과제 · 공포 없음 · 자동 저장</div>`,'intro');}function startGame(){state.started=true;save();closeModal();render();}
let approvalHome=null;
const originalClose=closeModal;
closeModal=function(){if(approvalHome){document.querySelector('aside').prepend(approvalHome);approvalHome=null;}originalClose();};
document.querySelector('#approval').onclick=()=>{modal('퇴근 서류철','<div id="sheet-content"></div>','approval-sheet');approvalHome=document.querySelector('aside>div:first-child');document.querySelector('#sheet-content').append(approvalHome);};
const originalModal=modal;
modal=function(...args){if(approvalHome){document.querySelector('aside').prepend(approvalHome);approvalHome=null;}originalModal(...args);};
// Loaded within the existing game script; preserves the original save and puzzles.
const roomAssetNames={hr:'hr',facility:'facility',audit:'audit',exit:'exit'};
for(const [id,name] of Object.entries(roomAssetNames)){
 rooms[id].art=()=>`<img class="scene-art" src="assets/${name}.png" alt="${rooms[id].title}의 마법 사무실 전경"><div class="dust" aria-hidden="true">${Array.from({length:12},(_,i)=>`<i class="mote" style="left:${8+i*7.4}%;top:${35+(i*17)%55}%;animation-delay:${-i*.7}s"></i>`).join('')}</div>`;
 const preload=new Image();preload.src=`assets/${name}.png`;
}
rooms.hr.spots=[['조직도',6,23,22,33,'org'],['뼈 대리',49,31,23,35,'skeleton'],['불씨 양초',2,57,10,23,'candle'],['복무 규정',84,16,15,38,'rules']];
rooms.facility.spots=[['만년빙 보관함',2,15,21,58,'ice'],['미믹 주임',35,31,36,52,'mimic'],['급식 지침',39,7,25,20,'diet']];
rooms.audit.spots=[['감사 규정',12,32,13,37,'auditRules'],['진실 반사경',29,10,28,66,'mirror'],['창밖의 달',76,4,15,25,'moon']];
const baseCheckOrg=checkOrg;
checkOrg=function(){const solved=state.org.join()==='인사부,시설부,감사부';baseCheckOrg();if(solved)$('#stage').classList.add('magic-change');};
const baseFeed=feed;
feed=function(id){baseFeed(id);if(id==='cold')$('#stage').classList.add('magic-meal');};
const baseEnding=ending;
ending=function(){baseEnding();$('#stage').classList.add('departure');};

render();
</script><script src="story.js"></script><script src="episode.js"></script><script src="visual-puzzles.js"></script><script src="art-direction.js"></script><script src="final-polish.js"></script><script src="game-audio.js"></script><script src="world-details.js"></script><script>
if(!state.started)intro();else if(state.ended)ending();
</script></body></html>
